[project]
name = "sat-desk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fused>=2.9.1",
    "numpy",
    "pandas",
    "geopandas",
    "shapely",
    "pyproj",
    "odc-geo",
    "rasterio",
    "matplotlib",
    "pillow",
    "requests",
    "duckdb>=1.4",
    "odc-stac",
    "pystac",
    "mercantile",
    "rio-tiler",
]

[tool.uv]
package = false
required-version = ">=0.12.17"
no-build = true
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release == '23.0.0'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64' and platform_release == '24.0.0'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.fused-render.app]
main = "worker.py"
idle_timeout_s = 1800
